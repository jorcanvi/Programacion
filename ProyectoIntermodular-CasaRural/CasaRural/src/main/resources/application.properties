# ===============================
# CONFIGURACIÓN GENERAL DEL PROYECTO
# ===============================

# Nombre de la aplicación (solo informativo)
spring.application.name=CasaRural


# ===============================
# CONFIGURACIÓN DE LA BASE DE DATOS (MySQL)
# ===============================

# URL de conexión a la base de datos
# Formato: jdbc:mysql://HOST:PUERTO/NOMBRE_BBDD
# En nuestro caso:
# - HOST: localhost (la base de datos está en nuestro equipo)
# - PUERTO: 3380 (según la configuración de Docker/DBeaver)
# - BBDD: casa_rural (la que hemos creado)
spring.datasource.url=jdbc:mysql://localhost:3380/casa_rural?useSSL=false&serverTimezone=Europe/Madrid

# Usuario de la base de datos
# Normalmente será "root" en entornos locales
spring.datasource.username=root

# Contraseña del usuario de la base de datos
# IMPORTANTE: cada alumno debe poner la suya
spring.datasource.password=root

# Driver de MySQL (permite a Java comunicarse con MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# CONFIGURACIÓN DE THYMELEAF
# ===============================

# Desactiva la caché de plantillas
# Muy útil en desarrollo, ya que permite ver cambios en HTML sin reiniciar
spring.thymeleaf.cache=false
