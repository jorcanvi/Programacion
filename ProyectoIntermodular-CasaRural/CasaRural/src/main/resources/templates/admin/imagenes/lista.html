<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Imágenes</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>

    <!-- Main -->
    <div class="main">

        <!-- Header -->
        <div class="header">
            <div>
                <p>Panel de administración</p>
                <h2>Imágenes</h2>
            </div>

            <!-- Botón contextual -->
            <a th:href="@{/admin/imagenes/nuevo}" class="btn">
                Nueva imagen
            </a>
        </div>

        <!-- CONTENIDO -->
        <div class="content">

            <div class="table-container">

                <table>

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>URL</th>
                        <th>Descripción ES</th>
                        <th>Descripción EN</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="img : ${imagenes}">
                        <td th:text="${img.id}"></td>
                        <td th:text="${img.url}"></td>
                        <td th:text="${img.descripcionEs}"></td>
                        <td th:text="${img.descripcionEn}"></td>

                        <td>
                            <div class="actions">

                                <!-- Ver imagen -->
                                <a th:if="${img.url != null}"
                                   th:href="@{${img.url}}"
                                   target="_blank"
                                   class="btn-icon"
                                   title="Ver imagen">

                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>

                                </a>

                                <!-- Editar -->
                                <a th:href="@{'/admin/imagenes/editar/' + ${img.id}}"
                                   class="btn-icon"
                                   title="Editar">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M12 20h9"></path>
                                        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
                                    </svg>
                                </a>

                                <!-- Eliminar -->
                                <a th:href="@{'/admin/imagenes/eliminar/' + ${img.id}}"
                                   class="btn-icon danger"
                                   onclick="return confirm('¿Eliminar imagen?')"
                                   title="Eliminar">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6l-1 14H6L5 6"></path>
                                        <path d="M10 11v6"></path>
                                        <path d="M14 11v6"></path>
                                        <path d="M9 6V4h6v2"></path>
                                    </svg>
                                </a>

                            </div>
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
