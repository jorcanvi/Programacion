<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Reservas</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>

    <!-- Main -->
    <div class="main">

        <!-- Header -->
        <div class="header">
            <div>
                <p>Panel de administración</p>
                <h2>Reservas</h2>
            </div>

            <a th:href="@{/admin/reservas/nuevo}" class="btn">
                Nueva reserva
            </a>
        </div>

        <!-- Contenido -->
        <div class="content">

            <div class="table-container">

                <table>

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Teléfono</th>
                        <th>Fecha inicio</th>
                        <th>Fecha fin</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="reserva : ${reservas}">
                        <td th:text="${reserva.id}"></td>
                        <td th:text="${reserva.nombreCliente}"></td>
                        <td th:text="${reserva.telefono}"></td>
                        <td th:text="${#temporals.format(reserva.fechaInicio, 'dd/MM/yyyy')}"></td>
                        <td th:text="${#temporals.format(reserva.fechaFin, 'dd/MM/yyyy')}"></td>

                        <td>
                            <div class="actions">

                                <!-- Editar -->
                                <a th:href="@{'/admin/reservas/editar/' + ${reserva.id}}"
                                   class="btn-icon"
                                   title="Editar">

                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M12 20h9"></path>
                                        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
                                    </svg>

                                </a>

                                <!-- Eliminar -->
                                <a th:href="@{'/admin/reservas/eliminar/' + ${reserva.id}}"
                                   class="btn-icon danger"
                                   onclick="return confirm('¿Eliminar reserva?')"
                                   title="Eliminar">

                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6l-1 14H6L5 6"></path>
                                        <path d="M10 11v6"></path>
                                        <path d="M14 11v6"></path>
                                        <path d="M9 6V4h6v2"></path>
                                    </svg>

                                </a>

                            </div>
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
