<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/public/es/head :: head('Contacto - Casa Rural')}"></head>

<body>

<header th:replace="~{fragments/public/es/header :: header}"></header>

<main>
    <h2>Contacto</h2>

    <p>
        Si deseas más información sobre la casa rural, puedes enviarnos un mensaje
        mediante el siguiente formulario.
    </p>

    <!-- Mensaje de confirmación -->
    <p th:if="${param.ok}" style="color: green;">
        El mensaje se ha enviado correctamente.
    </p>

    <!-- Mensaje de error -->
    <p th:if="${error}" th:text="${error}" style="color:red"></p>

    <!-- FORMULARIO -->
    <form th:action="@{/contacto}" method="post">
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" name="telefono">
        </div>

        <div>
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
        </div>

        <div>
            <button type="submit">Enviar</button>
        </div>
    </form>

    <!-- UBICACIÓN -->
    <section>
        <h3>Ubicación</h3>

        <p>
            Calle Ejemplo 123, 33000 Oviedo, Asturias
        </p>

        <iframe
                src="https://www.google.com/maps?q=Oviedo&output=embed"
                width="100%"
                height="300"
                style="border:0;"
                allowfullscreen=""
                loading="lazy">
        </iframe>
    </section>
</main>

<footer th:replace="~{fragments/public/es/footer :: footer}"></footer>

</body>
</html>
