<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/public/en/head :: head('Bookings - Country House')}"></head>

<body>

<header th:replace="~{fragments/public/en/header :: header}"></header>

<main>
    <h2>Bookings</h2>

    <p>
        The currently occupied booking periods for the country house are shown below.
        To make a booking, please contact us by phone.
    </p>

    <section>
        <h3>Unavailable dates</h3>

        <div th:if="${#lists.isEmpty(reservas)}">
            <p>There are no bookings registered at the moment.</p>
        </div>

        <table th:if="${not #lists.isEmpty(reservas)}">
            <thead>
            <tr>
                <th>Guest</th>
                <th>Phone</th>
                <th>Start date</th>
                <th>End date</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="reserva : ${reservas}">
                <td th:text="${reserva.nombreCliente}">Guest name</td>
                <td th:text="${reserva.telefono}">Phone</td>
                <td th:text="${reserva.fechaInicio}">2026-05-10</td>
                <td th:text="${reserva.fechaFin}">2026-05-12</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<footer th:replace="~{fragments/public/en/footer :: footer}"></footer>

</body>
</html>
